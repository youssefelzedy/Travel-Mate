<!DOCTYPE html>
<html>
<head>
  <title>Path Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-oGq9G9kCzJ+EIbN0rSwVSpSGN3mCTU9lNHR+8lJkL+k="
    crossorigin=""
  />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o8Nl4T3lQcOCq31hQ6YyU1XZjqL4p+UOQdtX8k9gKjE="
    crossorigin=""
  ></script>
  <script>
    // Sample coordinates (replace with your own)
    const coordinates = [
      { lat: 51.505, lng: -0.09 },
      { lat: 51.51, lng: -0.1 },
      { lat: 51.52, lng: -0.12 }
    ];

    // Center the map on the first coordinate
    const map = L.map('map').setView([coordinates[0].lat, coordinates[0].lng], 13);

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Draw the path
    const latlngs = coordinates.map(coord => [coord.lat, coord.lng]);
    const polyline = L.polyline(latlngs, { color: 'blue' }).addTo(map);

    // Fit the map to the polyline
    map.fitBounds(polyline.getBounds());
  </script>
</body>
</html>
